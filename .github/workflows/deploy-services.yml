name: Deploy Microservices

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'real-time-server/**'
      - '.github/workflows/deploy-services.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (auth, restaurant, order, driver, payment, realtime, or all)'
        required: true
        default: 'all'

env:
  AWS_REGION: af-south-1
  ECS_CLUSTER: zimfeast-cluster
  PROJECT: zimfeast

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.changes.outputs.auth }}
      restaurant: ${{ steps.changes.outputs.restaurant }}
      order: ${{ steps.changes.outputs.order }}
      driver: ${{ steps.changes.outputs.driver }}
      payment: ${{ steps.changes.outputs.payment }}
      realtime: ${{ steps.changes.outputs.realtime }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event.inputs.service }}" = "all" ] || [ "${{ github.event_name }}" = "push" ]; then
            # On push, detect which services changed
            if [ "${{ github.event_name }}" = "push" ]; then
              CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "services/")
            else
              CHANGED="services/"
            fi

            echo "auth=$([[ "$CHANGED" == *"services/auth-service"* || "$CHANGED" == *"services/shared"* || "${{ github.event.inputs.service }}" == "all" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "restaurant=$([[ "$CHANGED" == *"services/restaurant-service"* || "$CHANGED" == *"services/shared"* || "${{ github.event.inputs.service }}" == "all" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "order=$([[ "$CHANGED" == *"services/order-service"* || "$CHANGED" == *"services/shared"* || "${{ github.event.inputs.service }}" == "all" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "driver=$([[ "$CHANGED" == *"services/driver-service"* || "$CHANGED" == *"services/shared"* || "${{ github.event.inputs.service }}" == "all" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "payment=$([[ "$CHANGED" == *"services/payment-service"* || "$CHANGED" == *"services/shared"* || "${{ github.event.inputs.service }}" == "all" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "realtime=$([[ "$CHANGED" == *"real-time-server"* || "$CHANGED" == *"services/realtime-service"* || "${{ github.event.inputs.service }}" == "all" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          else
            # Deploy specific service
            for svc in auth restaurant order driver payment realtime; do
              echo "$svc=$([[ "${{ github.event.inputs.service }}" == "$svc" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            done
          fi

  deploy-django:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: auth
            port: 8001
            dockerfile: services/auth-service/Dockerfile
            deploy: ${{ needs.detect-changes.outputs.auth }}
          - name: restaurant
            port: 8002
            dockerfile: services/restaurant-service/Dockerfile
            deploy: ${{ needs.detect-changes.outputs.restaurant }}
          - name: order
            port: 8003
            dockerfile: services/order-service/Dockerfile
            deploy: ${{ needs.detect-changes.outputs.order }}
          - name: driver
            port: 8004
            dockerfile: services/driver-service/Dockerfile
            deploy: ${{ needs.detect-changes.outputs.driver }}
          - name: payment
            port: 8005
            dockerfile: services/payment-service/Dockerfile
            deploy: ${{ needs.detect-changes.outputs.payment }}
    if: |
      needs.detect-changes.outputs.auth == 'true' ||
      needs.detect-changes.outputs.restaurant == 'true' ||
      needs.detect-changes.outputs.order == 'true' ||
      needs.detect-changes.outputs.driver == 'true' ||
      needs.detect-changes.outputs.payment == 'true'

    steps:
      - name: Skip if not changed
        if: matrix.service.deploy != 'true'
        run: echo "Skipping ${{ matrix.service.name }} - no changes"

      - uses: actions/checkout@v4
        if: matrix.service.deploy == 'true'

      - name: Configure AWS credentials
        if: matrix.service.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: matrix.service.deploy == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push image
        if: matrix.service.deploy == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.PROJECT }}/${{ matrix.service.name }}:$IMAGE_TAG \
                       -t $ECR_REGISTRY/${{ env.PROJECT }}/${{ matrix.service.name }}:latest \
                       -f ${{ matrix.service.dockerfile }} .
          docker push $ECR_REGISTRY/${{ env.PROJECT }}/${{ matrix.service.name }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.PROJECT }}/${{ matrix.service.name }}:latest

      - name: Run migrations
        if: matrix.service.deploy == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # Run migrations using ECS RunTask
          TASK_DEF=$(aws ecs describe-task-definition --task-definition ${{ env.PROJECT }}-${{ matrix.service.name }} --query 'taskDefinition.taskDefinitionArn' --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=${{ env.PROJECT }}-private-*" --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups --filters "Name=tag:Name,Values=${{ env.PROJECT }}-ecs-sg" --query 'SecurityGroups[0].SecurityGroupId' --output text)

          aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition $TASK_DEF \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"${{ matrix.service.name }}","command":["python","manage.py","migrate","--noinput"]}]}' \
            --count 1

          echo "Migration task started for ${{ matrix.service.name }}"
          sleep 30

      - name: Deploy to ECS
        if: matrix.service.deploy == 'true'
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ matrix.service.name }} \
            --force-new-deployment

          echo "Deployed ${{ matrix.service.name }}"

  deploy-realtime:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.realtime == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push realtime image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.PROJECT }}/realtime:$IMAGE_TAG \
                       -t $ECR_REGISTRY/${{ env.PROJECT }}/realtime:latest \
                       -f services/realtime-service/Dockerfile .
          docker push $ECR_REGISTRY/${{ env.PROJECT }}/realtime:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.PROJECT }}/realtime:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service realtime \
            --force-new-deployment
