upstream auth_service {
    server auth-service:8001;
}

upstream restaurant_service {
    server restaurant-service:8002;
}

upstream order_service {
    server order-service:8003;
}

upstream driver_service {
    server driver-service:8004;
}

upstream payment_service {
    server payment-service:8005;
}

upstream realtime_service {
    server realtime-service:3001;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Health check
    location /health {
        return 200 '{"status": "ok"}';
        add_header Content-Type application/json;
    }

    # Auth Service
    location /api/accounts/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Restaurant Service
    location /api/restaurants/ {
        proxy_pass http://restaurant_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Order Service
    location /api/orders/ {
        proxy_pass http://order_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Driver Service
    location /api/drivers/ {
        proxy_pass http://driver_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment Service
    location /api/payments/ {
        proxy_pass http://payment_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Restaurant WebSocket (dashboard live updates)
    location /ws/restaurant/ {
        proxy_pass http://restaurant_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Driver WebSocket (location tracking)
    location /ws/driver/ {
        proxy_pass http://driver_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Socket.IO (real-time server)
    location /socket.io/ {
        proxy_pass http://realtime_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Media files (served from shared volume)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend (React SPA)
    location / {
        root /app/frontend;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Static assets with long cache
    location /assets/ {
        root /app/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
